[qemu]
profile = "linux-1.0"

[download]
cdrom = "infomagic/ldr/1994_06"

[extract]
source = "disc1.iso"
boot_image = "slakinst/boot144/bare"
root_image = "slakinst/root144/color144"
package_source = "slakware"

[install]
driver = "slackware-dialog"
variant = "2.0"

[install.packages]
source = "/dev/hdb1"

[postinst]
stages = ["tty", "x11"]
