[qemu]
profile = "linux-2.0"

[qemu.network]
device = "ne2k_isa"

[download]
cdrom = "infomagic/ldr/1997_04"

[extract]
source = "disc2.iso"
boot_image = "bootdsks.144/bare.i"
root_image = "rootdsks/color.gz"
truncate = ["bare.i"]

[install]
driver = "slackware-dialog"
variant = "3.1-3.4"

[postinst]
stages = ["modules", "tty", "x11"]

[postinst.modules]
enable = "ne io=0x300"
