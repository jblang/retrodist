[qemu]
profile = "linux-1.0"

[download]
cdrom = "infomagic/ldr/1994_12"

[extract]
source = "disc1.iso"
boot_image = "distributions/slakinst/boot144/bare"
root_image = "distributions/slakinst/root144/color144"
package_source = "distributions/slackware"

[install]
driver = "slackware-dialog"
variant = "2.1"

[install.packages]
source = "/dev/hdb1"

[postinst]
stages = ["tty", "x11"]
