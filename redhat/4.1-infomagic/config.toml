# Declarative configuration for the Python retro host.

[install]
driver = "redhat-c"

[download]
cdrom = "infomagic/ldr/1997_04"

[extract]
source = "disc1.iso"
boot_image = "images/boot.img"

[qemu]
profile = "linux-2.0"

[qemu.network]
device = "pcnet"

[install.disk]
root_partition = "/dev/hda2"
fat_partition = "/dev/hdb1"

[install.locale]
hardware_clock = "utc"
timezone = "UTC"
keymap = "us"

[install.redhat]
flow = "4x"
# Base is mandatory and is not shown in the component checklist.
components = [
  "C Development",
  # "Development Libraries",
  "C++ Development",
  "Print Server",
  # "News Server",
  # "NFS Server",
  # "Networked Workstation",
  # "Anonymous FTP/Gopher Server",
  # "Web Server",
  # "Network Management Workstation",
  # "Dialup Workstation",
  "Game Machine",
  "Multimedia Machine",
  "X Window System",
  "X Development",
  "X multimedia support",
  # "TeX Document Formatting",
  # "Emacs",
  # "Emacs with X windows",
  # "DOS/Windows Connectivity",
  "Extra Documentation",
]
x_card_label = "Cirrus Logic GD543x"
x_video_memory_label = "2048"
keyboard_after_packages = true
timezone_clock_control = "checkbox"
timezone_button = "Okay"
lilo_setup_dialogs = 2
lilo_boot_labels = true

[postinst]
stages = ["x11"]
