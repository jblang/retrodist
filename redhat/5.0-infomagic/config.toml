# Declarative configuration for the Python retro host.

[install]
driver = "redhat-c"

[download]
cdrom = "infomagic/ldr/1998_01"

[extract]
source = "disc1.iso"
boot_image = "images/boot.img"

[qemu]
profile = "linux-2.0"

[qemu.network]
device = "pcnet"

[install.disk]
root_partition = "/dev/hda2"
fat_partition = "/dev/hdb1"

[install.locale]
hardware_clock = "utc"
timezone = "Etc/UTC"
keymap = "us"

[install.redhat]
keyboard_early = true
pcmcia_prompt = false
cdrom_type_prompt = false
partitioning = "select-root-partition"
mouse_setup = "probe-and-emulation"
x11_setup = "pci-probe"
tcp_ip_form = "gateway-and-nameserver"
services_prompt = true
printer_prompt = "Configure Printer"
# Base is mandatory and is not shown in the component checklist.
components = [
  # "Printer Support",
  "X Window System",
  "Mail/WWW/News Tools",
  # "DOS/Windows Connectivity",
  "File Managers",
  # "Graphics Manipulation",
  # "X Games",
  # "Console Games",
  "X multimedia support",
  "Console Multimedia",
  # "Print Server",
  "Networked Workstation",
  "Dialup Workstation",
  # "News Server",
  # "NFS Server",
  # "SMB (Samba) Connectivity",
  # "IPX/Netware(tm) Connectivity",
  # "Anonymous FTP/Gopher Server",
  # "Web Server",
  # "DNS Name Server",
  # "Postgres (SQL) Server",
  # "Network Management Workstation",
  # "TeX Document Formatting",
  # "Emacs",
  # "Emacs with X windows",
  # "C Development",
  # "Development Libraries",
  # "C++ Development",
  # "X Development",
  # "Extra Documentation",
]
x_video_memory_label = "2 meg"
timezone_prompt = "Configure Timezones"
timezone_clock_control = "checkbox"
lilo_setup_dialogs = 2

[postinst]
stages = ["x11"]

[postinst.x11]
chipset = "clgd5446"
