# Declarative configuration for the Python retro host.

[install]
driver = "redhat-perl"

[install.redhat]
flow = "3.0.3"
package_series = [
    "Applications",
    # "DOS Compatibility",
    "Development",
    # "Development Libraries",
    "Documentation",
    # "Emacs",
    "Games",
    # "Mail",
    "Multimedia Programs",
    # "Network Admin",
    "Networking",
    # "Networking Servers",
    # "Other Programming Languages",
    # "Other Shells",
    # "Printing",
    # "Serial Communications",
    # "Tcl-Tk Extensions",
    # "TeX",
    "X Applications",
    "X Development",
    "X Games",
    "X Windows",
    # "XView",
    # "a.out compatitibility",
    # "Other",
]
root_password = "password"
# user = "redhat"
# user_home = true

[install.locale]
hardware_clock = "utc"
timezone = "UTC"
keymap = "us.map"

[download]
cdrom = "infomagic/ldr/1996_09"

[extract]
source = "disc2.iso"
boot_image = "images/1213/boot0015.img"
extra_images = ["images/rescue.img", "images/ramdisk1.img", "images/ramdisk2.img"]
truncate = ["boot0015.img"]

[qemu]
profile = "linux-1.2"

[postinst]
stages = ["x11"]
