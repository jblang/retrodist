# Declarative configuration for the Python retro host.

[install]
driver = "redhat-c"

[download]
cdrom = "infomagic/ldr/1996_12"

[extract]
source = "disc1.iso"
boot_image = "images/boot.img"

[qemu]
profile = "linux-2.0"

[qemu.network]
device = "pcnet"

[install.prompts]
boot_prompt = "LILO boot:"

[install.locale]
hardware_clock = "utc"
timezone = "Etc/UTC"
keymap = "us"

[install.redhat]
partitioning = "partition-disks"
mouse_setup = "configure-mouse"
x11_setup = "choose-card"
tcp_ip_form = "network-and-broadcast"
# Base is mandatory and is not shown in the component checklist.
components = [
  "C Development",
  # "Development Libraries",
  "C++ Development",
  "Print Server",
  # "News Server",
  # "NFS Server",
  # "Networked Workstation",
  # "Anonymous FTP/Gopher Server",
  # "Web Server",
  # "Network Management Workstation",
  # "Dialup Workstation",
  "Game Machine",
  "Multimedia Machine",
  "X Window System",
  "X Development",
  "X multimedia support",
  # "TeX Document Formatting",
  # "Emacs",
  # "Emacs with X windows",
  # "DOS/Windows Connectivity",
  "Extra Documentation",
]
x_card_label = "Cirrus Logic GD543x"
keyboard_late = true
timezone_prompt = "Configure Timezones"

[postinst]
stages = ["x11"]
