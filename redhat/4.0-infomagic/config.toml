# Declarative configuration for the Python retro host.

[install]
driver = "redhat-c"

[download]
cdrom = "infomagic/ldr/1996_12"

[extract]
source = "disc1.iso"
boot_image = "images/boot.img"

[qemu]
profile = "linux-2.0"

[qemu.network]
device = "pcnet"

[install.prompts]
boot_prompt = "LILO boot:"

[install.locale]
hardware_clock = "utc"
timezone = "Etc/UTC"
keymap = "us"

[install.redhat]
flow = "4x"
x_card_label = "Cirrus Logic GD543x"
keyboard_late = true
timezone_prompt = "Configure Timezones"

[postinst]
stages = ["x11"]
