# Declarative configuration for the Python retro host.

[install]
driver = "redhat-c"

[download]
cdrom = "infomagic/ldr/1998_06"

[extract]
source = "disc1.iso"
boot_image = "images/boot.img"

[qemu]
profile = "linux-2.0"

[install.prompts]
boot_sleep = 1

[install.disk]
root_partition = "/dev/hda2"
fat_partition = "/dev/hdb1"

[install.locale]
hardware_clock = "utc"
timezone = "Etc/UTC"
keymap = "us"

[install.redhat]
color_prompt = false
language_prompt = true
keyboard_early = true
pcmcia_prompt = false
cdrom_type_prompt = false
flow = "51"
# Base is mandatory and is not shown in the component checklist.
components = [
  # "Printer Support",
  "X Window System",
  "Mail/WWW/News Tools",
  # "DOS/Windows Connectivity",
  "File Managers",
  # "Graphics Manipulation",
  # "X Games",
  # "Console Games",
  "X multimedia support",
  "Console Multimedia",
  # "Print Server",
  "Networked Workstation",
  "Dialup Workstation",
  # "News Server",
  # "NFS Server",
  # "SMB (Samba) Connectivity",
  # "IPX/Netware(tm) Connectivity",
  # "Anonymous FTP/Gopher Server",
  # "Web Server",
  # "DNS Name Server",
  # "Postgres (SQL) Server",
  # "Network Management Workstation",
  # "TeX Document Formatting",
  # "Emacs",
  # "Emacs with X windows",
  # "C Development",
  # "Development Libraries",
  # "C++ Development",
  # "X Development",
  # "Extra Documentation",
]
x_video_memory_label = "2 meg"
timezone_prompt = "Configure Timezones"
timezone_clock_control = "checkbox"
timezone_button = "Ok"
lilo_setup_dialogs = 2
bootdisk_prompt = true

[postinst]
stages = ["x11"]

[postinst.x11]
chipset = "clgd5446"
