[qemu]
profile = "linux-1.2"

[download]
cdrom = "infomagic/ldr/1995_08"

[extract]
source = "disc4.iso"
boot_image = "images/1211/boot0015.img"
extra_images = ["images/rescue.img", "images/rootdisk.img"]
truncate = ["boot0015.img"]

[install]
driver = "redhat-dialog"
variant = "1.1"

[install.packages]
# The incomplete 1.1 automation never reaches these installation choices.
package_series = []

[install.accounts]
root_password = ""
# user = "redhat"
# user_home = true

[install.locale]
hardware_clock = "utc"
timezone = "UTC"
keymap = "us.map"

[postinst]
stages = ["x11"]
