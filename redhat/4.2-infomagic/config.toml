[qemu]
profile = "linux-2.0"

[qemu.network]
device = "pcnet"

[download]
cdrom = "infomagic/ldr/1997_08"

[extract]
source = "disc1.iso"
boot_image = "images/boot.img"

[install]
driver = "redhat-newt"
variant = "4.2"

[install.locale]
hardware_clock = "utc"
timezone = "Etc/UTC"
keymap = "us"

[install.accounts]
root_password = "password"

[install.packages]
# Base is mandatory and is not shown in the component checklist.
components = [
  "C Development",
  # "Development Libraries",
  "C++ Development",
  "Printer Support",
  # "Print Server",
  # "News Server",
  # "NFS Server",
  # "Networked Workstation",
  # "LAN Manager Connectivity",
  # "Anonymous FTP/Gopher Server",
  # "Web Server",
  # "Network Management Workstation",
  "Dialup Workstation",
  "Game Machine",
  "Multimedia Machine",
  "X Window System",
  "X Development",
  # "X multimedia support",
  # "Java Development",
  # "TeX Document Formatting",
  # "Emacs",
  # "Emacs with X windows",
  # "DOS/Windows Connectivity",
  # "Extra Documentation",
]

[postinst]
stages = ["x11"]
