# Declarative configuration for the Python retro host.

[install]
driver = "redhat-c"

[download]
cdrom = "infomagic/ldr/1997_08"

[extract]
source = "disc1.iso"
boot_image = "images/boot.img"

[qemu]
profile = "linux-2.0"

[qemu.network]
device = "pcnet"

[install.disk]
root_partition = "/dev/hda2"
fat_partition = "/dev/hdb1"

[install.locale]
hardware_clock = "utc"
timezone = "Etc/UTC"
keymap = "us"

[install.redhat]
keyboard_early = true
cdrom_type_prompt = false
flow = "42"
# Base is mandatory and is not shown in the component checklist.
components = [
  "C Development",
  # "Development Libraries",
  "C++ Development",
  "Printer Support",
  # "Print Server",
  # "News Server",
  # "NFS Server",
  # "Networked Workstation",
  # "LAN Manager Connectivity",
  # "Anonymous FTP/Gopher Server",
  # "Web Server",
  # "Network Management Workstation",
  "Dialup Workstation",
  "Game Machine",
  "Multimedia Machine",
  "X Window System",
  "X Development",
  # "X multimedia support",
  # "Java Development",
  # "TeX Document Formatting",
  # "Emacs",
  # "Emacs with X windows",
  # "DOS/Windows Connectivity",
  # "Extra Documentation",
]
x_card_label = "Cirrus Logic GD543x"
x_video_memory_label = "2048"
timezone_prompt = "Configure Timezones"
timezone_clock_control = "checkbox"
timezone_button = "Ok"
lilo_setup_dialogs = 2

[postinst]
stages = ["x11"]
